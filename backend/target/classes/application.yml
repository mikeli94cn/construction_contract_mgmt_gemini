spring:
  application:
    name: construction-contract-mgmt
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ccm_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:ccm_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

ccm:
  security:
    jwt:
      # Must be >= 32 bytes; override via CCM_JWT_SECRET environment variable in all deployments
      secret: ${CCM_JWT_SECRET:}
      issuer: ccm-enterprise
      expiration-minutes: ${CCM_JWT_EXPIRATION_MINUTES:480}
  storage:
    local-path: ${CCM_STORAGE_PATH:./target/ccm-documents}
  bootstrap:
    enabled: ${CCM_BOOTSTRAP_ENABLED:true}
    admin-password: ${CCM_BOOTSTRAP_ADMIN_PASSWORD:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
