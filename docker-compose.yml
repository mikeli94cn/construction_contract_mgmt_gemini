services:
  mysql:
    image: mysql:8.4
    container_name: ccm-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${CCM_DB_NAME:-ccm_db}
      MYSQL_USER: ${CCM_DB_USER:-ccm_app}
      MYSQL_PASSWORD: ${CCM_DB_PASSWORD:?CCM_DB_PASSWORD must be provided in .env}
      MYSQL_ROOT_PASSWORD: ${CCM_DB_ROOT_PASSWORD:?CCM_DB_ROOT_PASSWORD must be provided in .env}
    ports:
      - "${CCM_DB_PORT:-3316}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ccm-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8013
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${CCM_DB_NAME:-ccm_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${CCM_DB_USER:-ccm_app}
      SPRING_DATASOURCE_PASSWORD: ${CCM_DB_PASSWORD}
      CCM_JWT_SECRET: ${CCM_JWT_SECRET:?CCM_JWT_SECRET must be provided in .env}
      CCM_STORAGE_PATH: /var/lib/ccm/documents
      CCM_BOOTSTRAP_ADMIN_PASSWORD: ${CCM_BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "8013:8013"
    volumes:
      - document_data:/var/lib/ccm/documents

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ccm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8023:80"

volumes:
  mysql_data:
  document_data:
